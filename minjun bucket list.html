<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>우리 조 버킷리스트 아트 월</title>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Nanum Pen Script', cursive;
            background-color: #d4b895;
            background-image: url('https://www.transparenttextures.com/patterns/cork-board.png');
            background-attachment: fixed;
            text-align: center;
            padding-bottom: 100px;
        }
        header {
            margin: 60px auto 40px auto;
            background-color: rgba(255, 255, 255, 0.9);
            display: inline-block;
            padding: 20px 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: sticky;
            top: 20px;
            z-index: 100;
        }
        h1 { color: #333; font-size: 2.8rem; margin-bottom: 10px; }
        .clearfix::after { content: ""; display: block; clear: both; }
        .gallery-container { width: 90%; max-width: 1200px; margin: 0 auto; }
        
        /* 공통 카드 스타일 */
        .card {
            float: left; width: 31.33%; margin: 1%;
            background: linear-gradient(135deg, #fffcf0 0%, #fff3b0 100%);
            padding: 15px 15px 35px 15px;
            border-radius: 2px 2px 15px 5px;
            box-shadow: 3px 5px 15px rgba(0,0,0,0.15);
            position: relative;
            transform: rotate(-3deg);
            transition: transform 0.3s ease, z-index 0s;
        }
        .card:hover {
            transform: scale(1.05) rotate(0deg);
            z-index: 10;
        }
        .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 5px; margin-bottom: 15px; }
        .card h2 { color: #2c3e50; font-size: 1.8rem; margin-bottom: 10px; }
        .card p { color: #444; font-size: 1.3rem; text-align: left; line-height: 1.5; }
    </style>
</head>
<body>
    <header>
        <h1>🏖️ 2026 버킷리스트 아트 월 🏖️</h1>
        <p style="font-size: 1.5rem; color: #555;">우리 조의 꿈들을 코르크 보드에 붙였습니다!</p>
    </header>
    <main class="gallery-container clearfix">

         <!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>내 버킷리스트 카드</title>
    <style>
        /* 기본 카드 디자인 (자유롭게 수정 가능) */
        .card {
            width: 305px;
            margin: 50px auto;
            background: linear-gradient(135deg, #fcff33 0%, #fff3b0 100%);
            padding: 15px 15px 35px 15px;
            border-radius: 2px 2px 15px 5px;
            box-shadow: 3px 1px 20px rgb(251, 255, 0);
            /* 배지의 기준점이 되기 위한 필수 속성 */
            position: relative;
        }
        .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 5px; margin-bottom: 15px; }
        .card h2 { color: #2c3e50; font-size: 1.5rem; margin-bottom: 10px; }
        .card p { color: #444; font-size: 1.1rem; line-height: 1.5; }

        /* 1. 배지 (absolute) 관련 CSS를 작성하세요 */
            .badge {

            position: absolute;
            top: -10px;
            right: -30px;
            background-color: rgba(255, 0, 0, 0.8);
            color: white;
            padding: 5px 10px;
            border-radius: 50px;
            font-size: 0.9rem;
            box-shadow: 0 2px 5px rgb(255, 0, 0);
            transform: rotate(10deg); 
        }
        

        /* 2. 비밀 메모 (visibility) 및 hover 효과 관련 CSS를 작성하세요 */
        .secret-note {
            visibility: hidden;
        }
        .card:hover .secret-note {
            visibility: visible;
            position: absolute;
            bottom: 10px;
            left: 45px;
            background-color: rgba(47, 150, 37, 0.9);
            padding: 1px;
            border-radius: 50px;
            box-shadow: 0 2px 5px rgb(0, 255, 213);
        }

    </style>
</head>
<body>

    <div class="card">
        <div class="badge">💎money is power💎</div>

            <p>🪙 2. 통장에 1억 지니고 있기</p>
            <p class="secret-note">💡 TMI: 내 계좌엔 2026원이 있다. </p>      
        </div>
    </body>
</html>
