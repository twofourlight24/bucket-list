<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>내 버킷리스트 카드</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rubik+Spray+Paint&display=swap');

        /* 기본 카드 디자인 (자유롭게 수정 가능) */
        .card {
            width: 300px;
            margin: 50px auto;
            background: linear-gradient(135deg, #fffcf0 0%, #fff3b0 100%);
            padding: 15px 15px 35px 15px;
            border-radius: 2px 2px 15px 5px;
            box-shadow: 3px 5px 15px rgba(0, 0, 0, 0.15);
            /* 배지의 기준점이 되기 위한 필수 속성 */
            position: relative;
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        .card h2 {
            color: #2c3e50;
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .card p {
            color: #444;
            font-size: 1.1rem;
            line-height: 1.5;
        }

        /* 1. 배지 (absolute) 관련 CSS를 작성하세요 */
        .badge {

            position: absolute;
            left: -20px;
            background: #000000;
            color: #ffffff;
            border-radius: 20px;
            font-size: 18px;
            top: 0px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            padding: 5px;
        }


            /* 2. 비밀 메모 (visibility) 및 hover 효과 관련 CSS를 작성하세요 */
            .secret {
                position: relative;
                bottom: 15px;
                top: 20px;
                left: 70px;

                visibility: hidden;
                opacity: 0;
                transition: 0.5ms;
            }

            .card:hover .secret {
                visibility: visible;
                opacity: 0.3;
            }
    </style>
</head>

<body>
    <div class="card">
        <div class="badge">workout</div>
        <img src=image/images.jpg alt="운동사진">

        <h2>✨ 우준혁의 꿈</h2>
        <p> 1. 운동 꾸준히 하기</p>
        <p> 2. 살 빼기</p>

        <div class="secret">아직 운동 시작도 안함</div>

    </div>
</body>

</html>
