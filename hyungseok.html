<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
    <title>내 버킷리스트 카드</title>
    <style>
        /* 기본 카드 디자인 (자유롭게 수정 가능) */
         body {
            font-family: 'Audiowide', sans-serif;
            font-size:larger;
            padding: 20px;
        }
        .card {
            width: 300px;
            margin: 50px auto;
            background: linear-gradient(135deg, #46BEFF 0%, #3CFBFF 100%);
            padding: 15px 15px 35px 15px;
            border-radius: 2px 2px 15px 5px;
            box-shadow: 3px 5px 15px rgba(0, 0, 0, 0.15);
            /* 배지의 기준점이 되기 위한 필수 속성 */
            position: relative;
            transition: transform 0.5s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        .card h2 {
            color: #000000;
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .card p {
            color: #000000;
            font-size: 1.1rem;
            line-height: 1.5;
            margin: 5px 0;
        }

        /* 1. 배지 (absolute) 관련 CSS를 작성하세요 */
        .badge {
            position: absolute;
            top: -10px;
            right: -10px;
            background-color: #ff4757;
            color: white;
            padding: 8px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1rem;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.2);
            z-index: 10;
            transform: rotate(10deg);
        }


        /* 2. 비밀 메모 (visibility) 및 hover 효과 관련 CSS를 작성하세요 */
        .hidden-memo {
            margin-top: 15px;
            padding: 10px;
            background-color: rgba(255, 255, 255, 0.6);
            border-left: 4px solid #7FFFD4;
            font-size: 1rem;
            color: #7f8c8d;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .card:hover .hidden-memo {
            visibility: visible;
            opacity: 1;
        }

    </style>
</head>

<body>

    <div class="card">
        <div class="badge">D-30</div>
        <img src="img/개발자 사진.png" <h2>✨ 배형석의 꿈</h2>
        <p> 1. 해외 여행가기</p>
        <p> 2. 첫 웹사이트 만들어보기</p>
        <p> 3. 친구들 사귀기</p>

        <div class="hidden-memo"># 아직 여권 갱신도 안함</div>

    </div>
</body>

</html>
